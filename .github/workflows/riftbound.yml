name: Cartes et prix Riftbound

on:
  schedule:
    - cron: "17 3 * * *"   # chaque nuit vers 5h (heure suisse)
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Récupérer les prix Cardmarket
        run: node scripts/build-riftbound.mjs
      - name: Enregistrer si quelque chose a changé
        run: |
          git config user.name "hobbitdex-bot"
          git config user.email "hobbitdex-bot@users.noreply.github.com"
          git add riftbound-prices.json
          git diff --cached --quiet || (git commit -m "Riftbound : cartes et prix du $(date -u +%d.%m.%Y)" && git push)
